<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Намерете районното управление и участъковия инспектор за всеки адрес в София.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Полиция София — карта на РУ и участъци</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Cpath d='M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="map" role="application" aria-label="Карта на София"></div>

  <aside id="panel" class="panel" aria-live="polite">
    <div class="panel-grip" aria-hidden="true"></div>
    <header class="panel-head">
      <h1>Полиция София</h1>
      <form id="search" class="search" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 014.38 8.83l3.65 3.64a.75.75 0 01-1.06 1.06l-3.64-3.65A5.5 5.5 0 118.5 3zm0 1.5a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <input id="q" type="search" placeholder="Търсене на адрес" aria-label="Адрес" enterkeyhint="search">
      </form>
    </header>
    <div id="content" class="panel-body"></div>
  </aside>

  <div class="map-controls">
    <button id="locate" class="ctrl" type="button" aria-label="Моето местоположение" title="Моето местоположение">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M17.6 2.4a.6.6 0 01.13.66l-6.1 14.2a.6.6 0 01-1.13-.08L9.1 10.9 2.82 9.5a.6.6 0 01-.08-1.13l14.2-6.1a.6.6 0 01.66.13z"/></svg>
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data/police-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
